[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "earth-bench-pro-max"
version = "0.2.0"
description = "Earth-Bench pro max: reproducible Earth-agent benchmarks with composable plugins"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "haodi-jia" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

dependencies = [
    "numpy==1.26.4",
    "langchain-core==0.3.75",
    "langchain-openai==0.3.32",
    "langchain-mcp-adapters==0.1.9",
    "langgraph==0.6.6",
    "langgraph-prebuilt==0.6.4",
    "openai==1.99.9",
    "PyYAML==6.0.2",
    "pydantic==2.12.5",
    "fastmcp==2.11.3",
    "mcp==1.12.4",
    "rasterio==1.4.3",
    "affine==2.4.0",
    "ruptures==1.1.10",
    "opencv-python==4.11.0.86",
    "scikit-image==0.25.2",
    "scipy==1.14.1",
    "pandas==2.3.1",
    "statsmodels==0.14.5",
    "matplotlib==3.10.9",
    "jsonschema==4.26.0",
    "requests==2.34.2",
]

[project.scripts]
earth-bench-pro-max = "scripts.run:main"

[project.optional-dependencies]
hkg = ["torch==2.2.0", "transformers==4.57.1"]

[tool.setuptools.package-data]
agent = ["mcp.json", "tools/README.md"]
scripts = ["run.sh"]
evaluation = ["README.md", "PROTOCOL.md"]
benchmark = ["*.lock.json", "README.md"]
"plugins.hkg" = ["knowledge.json"]

[tool.setuptools.packages.find]
include = ["agent*", "benchmark*", "plugins*", "scripts*", "evaluation*"]
namespaces = false

[tool.uv]
no-build-package = ["rasterio", "numpy", "opencv-python"]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
